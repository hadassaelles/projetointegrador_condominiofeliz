<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Condomínio Feliz</title>
    <link rel="stylesheet" href="./pastaDeCss/loginGeral.css">
    
</head>
<body>
    <main class="login-card">
        <h1>Login</h1>
        <p class="subtitle">Acesse sua conta</p>

       <form id="formLogin" action="#" method="post">
            <label for="nome">Login</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu login" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button class="btn-gradient" type="submit">Entrar</button>
            <p id="mensagem"></p>
        </form>

        <script src="js/login.js"></script>
</body>
</html>
