<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova reserva | Funcionário</title>
  <link rel="stylesheet" href="css/novaReserva.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <!-- Cole aqui a mesma sidebar da página de Reservas -->
  </aside>

  <main class="main">

    <header class="page-header">
      <div>
        <h1>Nova reserva</h1>
        <p>Reserve uma área comum para um morador</p>
      </div>
      <a href="reservasFuncionarios.html" class="btn-back">&larr; Voltar</a>
    </header>

    <section class="form-panel">
      <!-- Troque action="#" pela rota do seu sistema que salva a reserva -->
      <form action="#" method="post" autocomplete="off">
        <div class="form-grid">

          <div class="field col-6">
            <label for="area">Área</label>
            <select id="area" name="area" required>
              <option value="" disabled selected>Selecione a área</option>
              <option>Salão de festas</option>
              <option>Churrasqueira</option>
              <option>Academia</option>
              <option>Piscina</option>
              <option>Quadra</option>
            </select>
          </div>

          <div class="field col-6">
            <label for="morador">Morador</label>
            <input type="text" id="morador" name="morador" placeholder="Nome do morador" required>
          </div>

          <div class="field col-3">
            <label for="unidade">Unidade</label>
            <input type="text" id="unidade" name="unidade" placeholder="Ex.: 204" required>
          </div>

          <div class="field col-3">
            <label for="bloco">Bloco</label>
            <input type="text" id="bloco" name="bloco" placeholder="Ex.: A" required>
          </div>

          <div class="field col-6">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" required>
          </div>

          <div class="field col-3">
            <label for="inicio">Início</label>
            <input type="time" id="inicio" name="inicio" required>
          </div>

          <div class="field col-3">
            <label for="fim">Fim</label>
            <input type="time" id="fim" name="fim" required>
          </div>

          <div class="form-actions col-12">
            <a href="reservas.html" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary">Confirmar reserva</button>
          </div>

        </div>
      </form>
    </section>

  </main>
</div>

</body>
</html>
