<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Mural de Comunicados</title></head>
<body>
    <h1>Mural de Comunicados</h1>
    {% for n in noticias %}
        <div style="border-bottom:1px solid #ccc; margin-bottom:16px; padding-bottom:8px;">
            <h3>{{ n.titulo }}</h3>
            <p><small>{{ n.criado_em|date:"d/m/Y H:i" }} · {{ n.autor_nome }} · {{ n.get_categoria_display }} · {{ n.get_prioridade_display }}</small></p>
            {{ n.conteudo|linebreaks }}
        </div>
    {% empty %}
        <p>Nenhum comunicado publicado até o momento.</p>
    {% endfor %}
    <p><a href="{% url 'home_morador' %}">Voltar</a></p>
</body>
</html>
