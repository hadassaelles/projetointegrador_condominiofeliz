{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Condomínio Feliz</title>
    <link rel="stylesheet" href="{% static 'pessoas/loginGeral.css' %}">
</head>
<body>
    <main class="login-card">
        <h1>Login</h1>
        <p class="subtitle">Acesse sua conta</p>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <p style="color:#dc2626; text-align:center;">E-mail ou senha inválidos.</p>
            {% endif %}

            <label for="nome">Nome</label>
            <input type="text" id="text" name="username" placeholder="Seu nome" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="password" placeholder="Digite sua senha" required>

            <button class="btn-gradient" type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
